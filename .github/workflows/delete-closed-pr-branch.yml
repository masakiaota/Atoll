name: Delete Closed Pull Request Branch

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-branch:
    # Fork branches are owned by their source repositories. The default branch
    # must also remain available even if it is used as a pull-request head.
    if: >-
      github.event.pull_request.merged == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Delete the closed pull request branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${PR_HEAD_REF}"
